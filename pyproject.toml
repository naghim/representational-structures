[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "robby-evolution"
dynamic = ["version"]
description = "Evolution of perception and representational structures in artificial agents"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Naghi Mirtill-Boglárka"},
]
dependencies = [
    "numpy>=1.21",
    "deap>=1.3",
    "matplotlib>=3.4",
    "seaborn>=0.11",
    "pandas>=1.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic.version]
attr = "robby.__version__"
